version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # stylelint-config-standard-scss pins stylelint's major version as a
      # peer dependency, so the two have to move together or npm ci fails.
      stylelint:
        patterns:
          - stylelint
          - stylelint-*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
